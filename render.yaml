# ─────────────────────────────────────────────────────────────
#  Despliegue del backend en Render (Infrastructure as Code)
#  Docs: https://render.com/docs/blueprint-spec
#  La base de datos vive en Supabase (ver DEPLOY.md).
# ─────────────────────────────────────────────────────────────
services:
  # ── API FastAPI (Docker) ─────────────────────────────────────
  - type: web
    name: alpacachino-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./back/Dockerfile
    dockerContext: ./back
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false                      # pegar cadena de Supabase
      - key: REDIS_URL
        fromService:
          type: redis
          name: alpacachino-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: alpacachino-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: alpacachino-redis
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        sync: false                      # https://alpacachino.com,https://www.alpacachino.com
      - key: PUBLIC_SITE_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: WEBPAY_COMMERCE_CODE
        sync: false
      - key: WEBPAY_API_KEY
        sync: false
      # Pago: transferencia manual. Sin esta variable el valor por defecto es mercadopago.
      - key: PAYMENT_PROVIDER
        value: manual
      - key: BANK_NAME
        sync: false
      - key: BANK_ACCOUNT_TYPE
        value: Cuenta corriente
      - key: BANK_ACCOUNT_NUMBER
        sync: false
      - key: BANK_HOLDER
        sync: false
      - key: BANK_RUT
        sync: false
      - key: BANK_EMAIL
        sync: false
      - key: SELLER_EMAIL
        sync: false
      - key: SELLER_PHONE
        sync: false
      # Supabase (solo las usa el backend)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false

  # Worker y beat de Celery: se quitaron para usar solo planes gratuitos (los workers
  # no tienen plan free). Sin ellos las reservas de stock no vencen solas. Para
  # volver a agregarlos, recuperar esos servicios y el grupo alpacachino-backend
  # del historial de git (commit anterior a "chore(deploy): sin worker ni beat").

  # ── Redis (broker + backend de resultados) ───────────────────
  - type: redis
    name: alpacachino-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []
