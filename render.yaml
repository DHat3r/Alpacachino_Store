# ─────────────────────────────────────────────────────────────
#  Despliegue del backend en Render (Infrastructure as Code)
#  Docs: https://render.com/docs/blueprint-spec
#  La base de datos vive en Supabase (ver DEPLOY.md).
# ─────────────────────────────────────────────────────────────
services:
  # ── API FastAPI (Docker) ─────────────────────────────────────
  - type: web
    name: alpacachino-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./back/Dockerfile
    dockerContext: ./back
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false                      # pegar cadena de Supabase
      - key: BACKEND_CORS_ORIGINS
        sync: false                      # https://alpacachino.vercel.app
      - key: PUBLIC_SITE_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
