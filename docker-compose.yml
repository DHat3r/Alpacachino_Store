# ─────────────────────────────────────────────────────────────
#  AlpacachinoStore — orquestación local de contenedores
#  Uso:  docker compose up -d --build
#  Herramientas:  docker compose --profile tools up -d
#
#  La base de datos es Supabase (DATABASE_URL en .env). El PostgreSQL local
#  solo se levanta para las pruebas o para trabajar sin conexión:
#      docker compose --profile local-db up -d db
# ─────────────────────────────────────────────────────────────
name: alpacachino

services:
  # ──────────── Base de datos local (pruebas / sin conexión) ────────────
  db:
    image: postgres:16-alpine
    container_name: alpacachino_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"                 # 5433 en el host para no chocar con un Postgres local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [alpacachino_net]
    profiles: [local-db]

  # ─────────────────────── API (FastAPI / back) ────────────────────
  api:
    build:
      context: ./back
      target: development
    container_name: alpacachino_api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      WATCHFILES_FORCE_POLLING: "true"   # hot reload fiable en Windows
    volumes:
      - ./back:/app
    ports:
      - "${API_PORT:-8000}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    networks: [alpacachino_net]

  # ───────────────────── Frontend dev (React) ──────────────────────
  web:
    build:
      context: ./front
      target: development
    container_name: alpacachino_web
    restart: unless-stopped
    environment:
      # Vacío = el cliente usa el proxy de Vite (/api → http://api:8000).
      # No apuntar a localhost:8000: ese puerto está ocupado en este equipo.
      # Las claves de Supabase NO se pasan al navegador: solo las usa el backend.
      VITE_API_URL: ""
    volumes:
      - ./front:/app
      - /app/node_modules                 # node_modules dentro del contenedor
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks: [alpacachino_net]

  # ───────────────────── Herramientas de apoyo ─────────────────────
  adminer:
    image: adminer:latest
    container_name: alpacachino_adminer
    ports:
      - "8081:8080"
    networks: [alpacachino_net]
    profiles: [tools]

volumes:
  pgdata:

networks:
  alpacachino_net:
    driver: bridge
